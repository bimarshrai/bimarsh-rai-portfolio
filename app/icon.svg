<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="border" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="48%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="letters" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="#09090B"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>

  <rect x="10" y="10" width="236" height="236" rx="48" fill="none" stroke="url(#border)" stroke-width="12" filter="url(#softGlow)"/>
  <rect x="14" y="14" width="228" height="228" rx="45" fill="none" stroke="url(#border)" stroke-width="7"/>

  <text x="128" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="-10" fill="url(#letters)">BR</text>
</svg>
